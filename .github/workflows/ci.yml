name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false

# Three stages: (1) fast JVM gate on every PR update and on main — architecture tests, unit and contract tests;
# (2) Android APK + lint; (3) iOS on macOS only on pushes to main or when triggered by hand
# (workflow_dispatch) — macOS minutes count 10x on a private repository.
jobs:
  verify:
    name: verify (architecture + unit tests, JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: No access token in the repository
        run: |
          if git grep -nE 'Ot_[0-9a-f]{20,}' -- . ':!docs/api-contract.md'; then
            echo "::error::An access token pattern was found in a versioned file"; exit 1
          fi

      # The gate is never silent: while the module does not exist (before PR arch/konture, wave 0) the
      # run summary shows a warning; that PR deletes the `if` branch so the gate cannot be disabled
      # again without a visible diff in this file (ADR-009).
      - name: Architecture tests (Konture)
        run: |
          if [ ! -f konture-test/build.gradle.kts ]; then
            echo "::warning title=Architecture gate not active::konture-test/ is missing — the Konture gate is OFF until PR 'arch: architecture tests' (wave 0) lands. Remove this branch in that PR."
            exit 0
          fi
          ./gradlew :konture-test:test --stacktrace

      - name: Unit and contract tests (shared modules, Android host)
        run: >
          ./gradlew
          :shared:domain:testAndroidHostTest
          :shared:data:testAndroidHostTest
          :shared:app:testAndroidHostTest
          --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/*/build/reports/tests/
            konture-test/build/reports/tests/
          if-no-files-found: ignore

  android:
    name: android (debug APK + lint)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Build release APK (R8 + resource shrinking)
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Lint
        run: ./gradlew :androidApp:lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/*.apk

  ios:
    name: ios (framework + app, macOS)
    runs-on: macos-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native distribution
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Unit tests (iOS simulator)
        run: >
          ./gradlew
          :shared:domain:iosSimulatorArm64Test
          :shared:data:iosSimulatorArm64Test
          :shared:app:iosSimulatorArm64Test
          --stacktrace

      - name: Build Kotlin framework
        run: ./gradlew :shared:app:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      # `-target` instead of `-scheme`: the project ships no shared .xcscheme (Xcode keeps schemes
      # per-user under xcuserdata by default), and a target build needs none.
      - name: Build iOS app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build
