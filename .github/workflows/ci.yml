name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false

# Three stages: (1) fast JVM gate on every PR update and on main — architecture tests, unit and contract tests;
# (2) Android APK + lint; (3) iOS on macOS only on pushes to main or when triggered by hand
# (workflow_dispatch) — macOS minutes count 10x on a private repository.
jobs:
  verify:
    name: verify (architecture + unit tests, JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: No access token in the repository
        run: |
          # Alphanumeric, not hex: a real token carries letters beyond a-f, so the original
          # [0-9a-f] class could not match one (ADR-012). Narrowing it again reopens the hole.
          if git grep -nE 'Ot_[0-9A-Za-z]{20,}' -- . ':!docs/api-contract.md'; then
            echo "::error::An access token pattern was found in a versioned file"; exit 1
          fi

      # Unconditional on purpose (ADR-009): the architecture gate cannot be switched off without a
      # visible diff in this file.
      - name: Architecture tests (Konture)
        run: ./gradlew :konture-test:test --stacktrace

      - name: Unit and contract tests (shared modules, Android host)
        run: >
          ./gradlew
          :shared:domain:testAndroidHostTest
          :shared:data:testAndroidHostTest
          :shared:app:testAndroidHostTest
          --stacktrace

      # The Java half of the interop (ADR-007): a Java test calling the Kotlin bridge, which only
      # the JVM module can compile. It runs here rather than inside the step above because the
      # shared modules have no `test` task of this shape.
      - name: Java interop tests (legacy partner catalogue, JVM)
        run: ./gradlew :legacy-catalog:test --stacktrace

      # Coverage is measured, not gated (ADR-006): the aggregated report is an artifact and its
      # per-module numbers go into docs/PRODUCT.md at delivery.
      - name: Coverage report (Kover, measured only)
        run: ./gradlew koverXmlReport koverHtmlReport --stacktrace

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            shared/*/build/reports/tests/
            konture-test/build/reports/tests/
            legacy-catalog/build/reports/tests/
            build/reports/kover/
          if-no-files-found: ignore

  android:
    name: android (debug APK + lint)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Build release APK (R8 + resource shrinking)
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Lint
        run: ./gradlew :androidApp:lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/*.apk

  ios:
    name: ios (framework + app, macOS)
    runs-on: macos-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native distribution
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Unit tests (iOS simulator)
        run: >
          ./gradlew
          :shared:domain:iosSimulatorArm64Test
          :shared:data:iosSimulatorArm64Test
          :shared:app:iosSimulatorArm64Test
          --stacktrace

      - name: Build Kotlin framework
        run: ./gradlew :shared:app:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      # `-target` instead of `-scheme`: the project ships no shared .xcscheme (Xcode keeps schemes
      # per-user under xcuserdata by default), and a target build needs none.
      - name: Build iOS app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build
