# The device every golden is recorded on. Pinned rather than defaulted, because a golden is only
# comparable against the exact same configuration.
#
# `pt-rBR` is the point: Robolectric defaults to `en`, so the first spike capture came out in
# English off `values-en/`. pt-BR is what the app ships (SPEC E6) and therefore what the goldens
# have to show — an English golden would pass CI forever while nobody ever looked at the shipping
# copy.
sdk=34
qualifiers=pt-rBR-w360dp-h740dp-xhdpi
